id: credential-pool-harmonization
name: Credential Pool Audit & HKCU/HKLM Harmonization Playbook
version: 1.0.0
domain: runtime-and-credentials
summary: Zero-plaintext workflow to audit API key pools, eliminate Registry duplicates, mirror HKCU/HKLM safely, and verify runtime alias projection.
token_budget: 1600
skills:
  - key-pool-audit
  - sota-server-lifecycle-warmup
triggers:
  keywords:
    - hkcu
    - hklm
    - credential
    - api key
    - openrouter
    - pool
    - sha8
    - duplicada
    - hf_credentials
    - hf_key
    - hf_token
    - observatory
  agents:
    - securitychief
    - chico
    - auditor
parameters:
  - name: live_probe
    type: boolean
    required: false
    default: false
    description: Run read-only HTTP auth probes (0 LLM tokens) in addition to offline registry checks.
  - name: pool_filter
    type: string
    required: false
    default: ""
    description: Optional pool filter passed to Audit-KeyPools.ps1 -Pool.
pre_gates:
  - id: registry_ssot_present
    check: Test-Path data/credential_registry.json
    on_fail: abort
steps:
  - stage_id: masked_registry_audit
    role: explore
    action: Run offline masked audit across HKCU, HKLM, and Process without emitting plaintext secrets.
    command_or_tool: powershell -NoProfile -ExecutionPolicy Bypass -File .agents/skills/key-pool-audit/scripts/Audit-KeyPools.ps1 -AnomaliesOnly -Json -Strict
    expected_output: JSON anomaly summary identifying any DIFF_VALUES, HKCU_ONLY/HKLM_ONLY, or duplicate sha8.
    checkpoint: true
    on_fail: escalate
  - stage_id: harmonize_registry
    role: execute
    action: Mirror or remove managed ecosystem credentials using Set-EcosystemCredential.ps1 with WM_SETTINGCHANGE broadcast.
    command_or_tool: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ops/Set-EcosystemCredential.ps1 -Sincronizar
    expected_output: All managed ecosystem vars report SYNCED across HKCU and HKLM without plaintext output.
    checkpoint: true
    on_fail: escalate
  - stage_id: verify_strict_zero_anomalies
    role: verify
    action: Re-run strict audit and credential SSOT contract tests.
    command_or_tool: uv run --no-sync python -m pytest tests/test_credenciais.py tests/test_credential_registry_ssot.py -q
    expected_output: Strict audit exits 0 with Anomalies=[] and pytest passes 100%.
    checkpoint: true
    on_fail: abort
exit_criteria:
  - Zero FAIL or WARN anomalies in Audit-KeyPools.ps1 -Strict.
  - Zero plaintext secrets written to repo, logs, or stdout.
