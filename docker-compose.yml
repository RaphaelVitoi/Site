secrets:
  auth_secret:
    file: ./.cerebro/secrets/auth_secret.txt

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=17042
    ports:
      - '17042:17042'
    restart: always
    volumes:
      - ./.cerebro:/app/.cerebro
      - ./queue:/app/queue
      - ./data/chroma_db:/app/data/chroma_db
      - ./tasks.db:/app/tasks.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - AUTH_SECRET_FILE=/run/secrets/auth_secret
      - NEXUS_API_BASE=http://backend:17042
    ports:
      - '3000:3000'
    restart: always
    secrets:
      - auth_secret
