services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
      - "17042:17042"
    restart: always
    volumes:
      - ./.claude:/app/.claude
      - ./queue:/app/queue
      - ./data/chroma_db:/app/data/chroma_db
      - ./tasks.db:/app/tasks.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - AUTH_SECRET_FILE=/run/secrets/auth_secret
    secrets:
      - auth_secret
    ports:
      - "3000:3000"
    restart: always

secrets:
  auth_secret:
    file: ./.claude/secrets/auth_secret.txt
