services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: always

  backend:
    build:
      context: .
      dockerfile: .claude/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./.claude:/app/.claude
      - ./queue:/app/queue
      - ./data/chroma_db:/app/data/chroma_db
      - ./tasks.db:/app/tasks.db
    restart: always
