[project]
name = "nexus-orchestrator"
version = "0.1.0"
description = "Micro-servidor SOTA e Orquestrador de Agentes"
dependencies = [
    "aiohttp>=3.13.5",
    "aiosqlite>=0.19.0",
    "fastapi>=0.111.1",
    "pydantic>=2.12.5",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "chromadb>=0.4.0",
    "openai>=1.37.0",
    "anthropic>=0.17.0",
    "rich>=13.7.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
pythonpath = ["."]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["core", "database", "engine", "utils", "api", "agents", "llm", "worker", "task_executor"]

[tool.ruff.lint]
select = [
    "E", "F",     # Erros e falhas padrao
    "S",          # flake8-bandit (Auditoria de Seguranca: senhas hardcoded, injecao SQL/Shell)
    "B",          # flake8-bugbear (Falhas de design que levam a vazamento de memoria)
    "FAST",       # FastAPI-specific rules (Detecta dependencias mal injetadas, rotas sem async)
]
ignore = [
    "E501",       # Ignorado (Friccao Zero): Prompts de LLM perdem integridade visual se quebrados forcadamente
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["."]
exclude = [".venv", "__pycache__", "node_modules", ".next"]
reportMissingImports = true
reportMissingTypeStubs = false
reportAttributeAccessIssue = "warning"
