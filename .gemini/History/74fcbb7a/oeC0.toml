[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
pythonpath = ["."]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["core", "database", "engine", "utils", "api", "agents", "llm", "worker", "task_executor"]
