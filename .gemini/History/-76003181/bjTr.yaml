name: Pokerserver
version: 0.0.1
mcpServers:
  - name: github-vitoi
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}$
models:
  - name: "Gemini 3 Pro"
    provider: gemini
    model: gemini-3-pro-preview
    apiKey: ${GEMINI_API_KEY}$
  - name: "Gemini 2.5 Pro"
    provider: gemini
    model: gemini-2.5-pro
    apiKey: ${GEMINI_API_KEY}$
