name: Pokerserver
version: 0.0.1
mcpServers:
  - name: github-vitoi
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}$
models:
  - name: "Gemini 2.5 Pro (Debug)"
    provider: "google-sdk"
    model: "gemini-1.5-pro" # Mude para 1.5 para garantir compatibilidade de endpoint
    apiKey: "AIzaSyCCtOVqyOqn2w50VpTqnAlcWQMmKInWxRY"
    roles:
      - chat
