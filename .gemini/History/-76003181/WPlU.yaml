name: Pokerserver
version: 0.0.1
mcpServers:
  - name: github-vitoi
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}$
models:
  - name: Gemini 2.5 Pro (Razão e Síntese)
    provider: "google-sdk"
    model: gemini-2.5-pro
    apiKey: "AIzaSyAIHLiQAOgo07GvsYe-ljrfv57TwXFwZ7U"
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.2
      topP: 0.8
      topK: 40
  - name: Gemini 2.5 Flash (Execução e Código)
    provider: "google-sdk"
    model: gemini-2.5-flash
    apiKey: "AIzaSyAIHLiQAOgo07GvsYe-ljrfv57TwXFwZ7U"
    roles:
      - edit
      - apply
      - autocomplete
    autocompleteOptions:
      debounceDelay: 200
      maxPromptTokens: 1024
    defaultCompletionOptions:
      temperature: 0.2
      topP: 0.8
