name: Pokerserver
version: 0.0.1
schema: v1
mcpServers:
  - name: github-vitoi
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}$
models:
  - name: "Gemini 2.5 Pro (Análise)"
    provider: "google-sdk"
    model: "gemini-2.5-pro-latest" # O sufixo -latest garante a versão estável da linha 2.5
    apiKey: "GEMINI_API_KEY"
    roles:
      - chat
    completionOptions:
      temperature: 0.1 # Rigor analítico para AHSD

  - name: "Gemini 2.5 Flash (Velocidade)"
    provider: "google-sdk"
    model: "gemini-2.5-flash-latest"
    apiKey: "GEMINI_API_KEY"
    roles:
      - edit
      - apply
      - autocomplete
