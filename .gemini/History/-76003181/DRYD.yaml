name: Meu MCP
version: 0.1.0
schema: v1
mcpServers:
  - name: github-vitoi
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}$
models:
  - name: Gemini 2.5 Pro (Análise)
    provider: google-sdk
    model: gemini-2.5-pro-latest
    apiKey: SUA_CHAVE_AQUI
    roles:
      - chat
    completionOptions:
      temperature: 0.1
  - name: Gemini 2.5 Flash (Velocidade)
    provider: google-sdk
    model: gemini-2.5-flash-latest
    apiKey: SUA_CHAVE_AQUI
    roles:
      - edit
      - apply
      - autocomplete
