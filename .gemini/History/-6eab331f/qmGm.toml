[package]
name = "vitoi-equity-engine"
version = "0.1.0"
edition = "2021"
description = "SOTA WebAssembly Poker Equity Evaluator"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.92"
rs_poker = "0.2"
console_error_panic_hook = { version = "0.1.7", optional = true }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["console_error_panic_hook"]

[profile.release]
lto = true
opt-level = 3
