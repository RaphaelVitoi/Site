name: My Config
version: 1.0.0
schema: v1
models:
  - name: "Gemini 2.5 Pro"
    provider: google-sdk
    model: google/gemini-2.5-pro
    apiKey: ${GEMINI_API_KEY} # Referência dinâmica
    roles:
      - chat
  - name: "Gemini 2.0 Flash"
    provider: google-sdk
    model: google/gemini-2.0-flash
    apiKey: ${GEMINI_API_KEY}
    roles:
      - chat
      - edit
      - apply
      - autocomplete
    autocompleteOptions:
      debounceDelay: 350
      maxPromptTokens: 512 # Redução de carga por requisição
