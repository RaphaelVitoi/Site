name: My Config
version: 1.0.0
schema: v1
models:
  - name: gemini
    provider: Google
    model: gemini-2.5-pro
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.7
      maxTokens: 1500
  - name: Codestral
    provider: mistral
    model: codestral-latest
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      onlyMyCode: true
  - name: Google-Compatible
    provider: Google
    apiBase: http://my-endpoint/v1
    model: gemini-2.5-pro
    capabilities:
      - tool_use
      - image_input
    roles:
      - chat
      - edit
  - name: Gemini 3 Pro
    provider: gemini
    model: gemini-3.5-pro-preview
    apiKey: AIzaSyD7xymY-jnm1rasUWc8F5X5GYQWydu24cc
