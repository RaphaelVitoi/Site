steps:
  # 1. Build da Imagem Docker SOTA
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/frontend:$COMMIT_SHA',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/frontend:latest',
        '-f',
        'frontend/Dockerfile',
        './frontend',
      ]

  # 2. Push para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/frontend',
        '--all-tags',
      ]

  # 3. Deploy Serverless no Cloud Run (Auto-Scaling de 0 a N)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nexus-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/frontend:$COMMIT_SHA'
