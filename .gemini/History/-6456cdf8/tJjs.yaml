name: Example Config
version: 1.0.0
schema: v1
models:
  - name: "Gemini 2.5 Pro (Análise)"
    provider: "google-sdk"
    model: "gemini-2.5-pro-latest" # O sufixo -latest garante a versão estável da linha 2.5
    apiKey: "AIzaSyCdprQOHYf-altAoQMYYMD"
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.1 # Rigor analítico para AHSD
  - name: "Gemini 2.5 Flash (Velocidade)"
    provider: "google-sdk"
    model: "gemini-2.5-flash-latest"
    apiKey: "AIzaSyCdprQOHYf-altAoQMYYMD"
    roles:
      - edit
      - apply
      - autocomplete
