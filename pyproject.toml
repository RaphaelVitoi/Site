# ==============================================================================
# NEXUS ORCHESTRATOR — pyproject.toml SOTA v2
# Fonte de verdade unica para dependencias, linters, formatadores e tipagem.
# Gerenciador canônico: uv  |  Lock file: uv.lock
# ==============================================================================

[project]
name = "nexus-orchestrator"
version = "0.2.0"
description = "Orquestrador SOTA de Agentes LLM com DAG, RAG e resiliencia multi-provedor"
readme = "AGNOSTIC_SYSTEM.md"
requires-python = ">=3.12"
dependencies = [
    # ── NUCLEO ASSINCRONO ──────────────────────────────────────────────
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.0",
    "aiosqlite>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # ── PYDANTIC & SETTINGS ────────────────────────────────────────────
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",  # >=2.14.2 corrige GHSA-4xgf-cpjx-pc3j
    # ── MOTOR MATEMATICO & ANALYTICS ──────────────────────────────────
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    # ── RAG & MEMORIA VETORIAL ─────────────────────────────────────────
    # SEGURANCA: chromadb carrega QUATRO advisories abertas, nenhuma com versao
    # de correcao publicada (medido com `pip-audit -r requirements.txt` em
    # 2026-08-30, sobre 1.5.9):
    #   PYSEC-2026-311  injecao de codigo PRE-autenticacao no servidor
    #   CVE-2026-45833  injecao de codigo por atacante AUTENTICADO
    #   CVE-2026-45830  falta de validacao de autorizacao (ler/escrever/apagar)
    #   CVE-2026-45831  SimpleRBACAuthorizationProvider nao checa o recurso
    # Ate 2026-08-30 esta nota citava apenas a primeira; as outras tres
    # surgiram depois e o texto que sustenta o aceite de risco nao as
    # acompanhou. A lista fica nominal de proposito: aceite de risco que nao
    # enumera o que aceita nao e aceite, e adivinhacao.
    #
    # AS QUATRO SAO DE MODO SERVIDOR, e o projeto nao sobe servidor: so usa
    # chromadb.PersistentClient (embarcado, sem porta em escuta), em
    # memory_rag.py e scripts/utils/ingest_rag.py. Verificado por varredura em
    # 2026-08-30: nenhum HttpClient, nenhum `chroma run` no repositorio.
    # E POR ISSO que o aceite se sustenta -- nao por serem de baixa gravidade.
    #
    # NAO migrar para chromadb.HttpClient nem subir `chroma run` sem antes
    # confirmar que as advisories foram corrigidas: essa migracao converte as
    # quatro de inalcancaveis em alcancaveis, de uma vez. Limite inferior
    # deixado aberto de proposito, para adotar a correcao quando publicada.
    #
    # A fase 3 do cwv_gate.ps1 roda somente `npm audit`, entao NENHUMA destas
    # e barrada por portao: a revisao do lado Python e manual, pela §2 do
    # CLAUDE.md.
    "chromadb>=0.6.0",
    "lancedb>=0.17.0",
    "pyarrow>=18.0.0",
    "onnxruntime>=1.20.0",
    "sentence-transformers>=3.3.0",
    # ── CLIENTES LLM ──────────────────────────────────────────────────
    "google-genai>=1.2.0",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "httpx>=0.28.0",
    # ── INGESTAO DE DOCUMENTOS ─────────────────────────────────────────
    "pypdf>=6.16.0,<7.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "Pillow>=12.3.0",
    # ── MULTIMIDIA (opcional — carregamento lazy) ──────────────────────
    # moviepy REMOVIDO em 2026-08-21: exige pillow<12.0, prendendo o projeto em
    # Pillow 11.x (10 CVEs, todas corrigidas em 12.3.0). 2.2.1 e a ultima versao
    # e nao levanta o teto. Zero imports no codigo - so figurava aqui.
    "opencv-python-headless>=4.13.0,<5.0.0",
    # ── UTILITARIOS ───────────────────────────────────────────────────
    "regex>=2026.5.0",
    "requests>=2.34.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "tqdm>=4.67.0,<5.0.0",
    "rich>=15.0.0,<16.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "tenacity>=9.1.0,<10.0.0",
    "defusedxml>=0.7.1",
    # ── FILESYSTEM & CLOUD ────────────────────────────────────────────
    "watchdog>=6.0.0,<7.0.0",
    "watchfiles>=1.2.0,<2.0.0",
    "cloudpathlib>=0.24.0,<1.0.0",
    # ── INFRA & MONITORAMENTO ─────────────────────────────────────────
    "psutil>=7.2.0,<8.0.0",
    "loguru>=0.7.3",
    "typer>=0.25.1",
    "edge-tts>=7.2.8",
    "mcp>=2.0.0",
    "nanobind>=2.15.0",
    "pyperclip>=1.11.0",
]

[project.scripts]
nexus = "scripts.cli.nexus:app"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "database", "engine", "utils", "api", "agents", "llm", "worker", "cli", "monitoring", "governance", "conductor", "math", "scripts", "scripts.cli"]


[project.optional-dependencies]

# Instalado com: uv sync --extra dev
dev = [
    "ruff>=0.16.3",
    "pylint>=4.0.7",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pylint>=4.0.7",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "httpx>=0.28.0",
    "pytest-watcher>=0.6.3",
    "cmake>=4.4.2",
    "ninja>=1.13.0",
    "locust>=2.46.3",
    "types-aiofiles>=25.1.0.20260518",
    "types-psutil>=7.2.2.20260518",
]

# ==============================================================================
# UV — Gerenciador de Pacotes (substituicao moderna de pip/venv)
# ==============================================================================
[tool.uv]
# Sincronizado via dependency-groups.dev

# ── PISOS DE SEGURANCA PARA DEPENDENCIAS TRANSITIVAS ─────────────────────────
# Equivalente Python do que "overrides" faz no package.json: corrige CVE de
# transitiva sem promove-la a dependencia direta.
#
# Usa constraint-dependencies e NAO override-dependencies de proposito. Um
# "constraint" respeita o teto declarado pelo pai e FALHA a resolucao se for
# impossivel; um "override" atropela o pai e produziria, por exemplo, um torch
# que o sentence-transformers nao suporta. Falhar alto e o comportamento
# desejado - foi exatamente o silencio do resolvedor que deixou pillow 11.3.0
# fixado no lock por uma sessao inteira (ver commit 43689d83).
#
# Verificado contra a base OSV em 2026-08-21. Quem puxa cada uma:
#   starlette    <- fastapi, mcp, sse-starlette      10 advisories
#   cryptography <- google-auth, pyjwt                7 advisories
#   pyasn1       <- pyasn1-modules                    6 advisories
#   setuptools   <- torch                             2 advisories
#   torch        <- sentence-transformers             1 advisory
constraint-dependencies = [
    "starlette>=1.3.1",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.4",
    "setuptools>=83.0.0",
    "torch>=2.13.0",
]

# ==============================================================================
# PYTEST
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "-p no:cacheprovider",
    "--strict-markers",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
]
tmp_path_retention_policy = "none"
tmp_path_retention_count = 0
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
pythonpath = [
    ".",
    "scripts",
    "engine",
    "core",
    "utils",
    "agents",
    "database",
    "monitoring",
    "governance",
    "conductor",
    "tools",
    "math"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: testes lentos (>5s) que requerem LLM ou I/O pesado",
    "integration: testes de integracao que requerem servicos externos",
    "unit: testes unitarios puros sem I/O externo",
    "pmev: suite tematica Perspectiva Matematica e Poker Game Theory (Raphael Vitoi)",
    "core_ai: suite tematica Mente Coletiva, Motores Bayesianos e Grafos Causais",
    "agents_llm: suite tematica Multi-Agent System, 19 Avatares e LLM Routing",
    "database_infra: suite tematica Infraestrutura, Fila SQLite WAL, MDA e Circuit Breaker",
    "security_governance: suite tematica SOTA Guard, Hardening, Desambiguacao e Nexus CLI",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:google.genai.*",
    "ignore::DeprecationWarning:opentelemetry.*",
    "ignore:.*asyncio\\.iscoroutinefunction.*:DeprecationWarning",
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient`.*:DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
]


# ==============================================================================
# COVERAGE
# ==============================================================================
[tool.coverage.run]
branch = true
source = ["core", "database", "engine", "utils", "api", "agents", "llm", "worker"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ==============================================================================
# RUFF — Linter + Formatter SOTA (substitui flake8, isort, black, bandit)
# ==============================================================================
[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".gemini", ".venv", "__pycache__", "node_modules",
    ".next", "frontend", "archive", ".backups", "_backups",
    "nexus_orchestrator.egg-info", "skills", "plugins",
    ".agents",
]
extend-exclude = ["skills", "plugins", ".agents"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "S",      # bandit (security)
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "I",      # isort
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "FAST",   # FastAPI patterns
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print (force logging)
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "N",      # pep8-naming
    "ERA",    # eradicate (commented-out code)
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "PLC0415",# import-outside-top-level (enforce top-level imports)
]
ignore = [
    "E501",   # line-too-long: gerenciado pelo formatter
    "T201",   # print: permitido em scripts CLI e task_executor
    "S101",   # assert: permitido em testes
    "S404",   # subprocess-import: gerenciado pela camada de autonomy / ops
    "S603",   # subprocess: gerenciado pela camada de autonomy
    "S607",   # partial-executable: idem
    "ERA001", # commented-out code: comentarios SOTA sao documentacao
    "N806",   # uppercase variable: convencoes de algebra linear (X, y)
    "N818",   # exception-name: convencoes de dominio em portugues (ForaDaAutoridadeDaPolitica)
    "S105",   # hardcoded-password-string: falsos positivos com tokens e delimitadores de LLM
    "G004",   # logging-f-string: permitido em modulos com # pylint: disable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert statements em testes
    "ARG001", # unused arguments em fixtures
    "ARG002", # idem
    "T201",   # prints em testes de debug
    "SIM117", # nested with em testes
]
"task_executor.py" = ["T201", "S603", "S607", "ERA001"]
"scripts/**" = ["T201", "S603", "S607", "PLC0415", "PT", "B008", "B904", "S110", "S112", "E741"]
"memory_rag.py" = ["N806"]  # convencao vetorial
"skills/**" = ["N999"]
"**/.hermes-plugin/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "database",
    "engine",
    "agents",
    "llm",
    "worker",
    "utils",
    "api",
    "scripts",
    "monitoring",
    "governance",
    "conductor",
    "tools",
    "cli",
    "math"
]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

# ==============================================================================
# PYRIGHT — Type Checker (modo standard para projeto SOTA)
# ==============================================================================
[tool.pyright]
include = [
    "engine",
    "core",
    "utils",
    "api",
    "agents",
    "llm",
    "database",
    "worker",
    "scripts",
    "monitoring",
    "governance",
    "conductor",
    "tools",
    "cli",
    "math"
]
extraPaths = [
    ".",
    ".venv/Lib/site-packages",
    ".venv/lib/site-packages",
    "scripts",
    "engine",
    "core",
    "utils",
    "agents",
    "database",
    "monitoring",
    "governance",
    "conductor",
    "tools",
    "math"
]
exclude = ["**/__pycache__", "**/.*", ".venv", "node_modules", "frontend", "archive", "nexus_orchestrator.egg-info", "core/vendor"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"           # Upgrade de "basic" para "standard"
reportMissingImports = true
reportMissingModuleSource = "warning"
reportAttributeAccessIssue = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportReturnType = "error"
reportArgumentType = "error"
reportIndexIssue = "warning"
useLibraryCodeForTypes = true
