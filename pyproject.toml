[project]
name = "nexus-orchestrator"
version = "0.1.0"
description = "Micro-servidor SOTA e Orquestrador de Agentes"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "aiosqlite>=0.22.1",
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.47.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "chromadb>=1.5.9",
    "onnxruntime>=1.26.0",
    "sentence-transformers>=5.4.1",
    "google-genai>=1.68.0",
    "openai>=2.36.0",
    "anthropic>=0.102.0",
    "httpx>=0.28.1",
    "pypdf>=6.11.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "regex>=2026.2.28",
    "requests>=2.34.0",
    "PyYAML>=6.0.3",
    "tqdm>=4.67.3",
    "rich>=15.0.0",
    "psutil>=7.2.2",
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.1.4",
    "watchdog>=6.0.0",
    "watchfiles>=1.1.1",
    "Pillow>=11.0.0",
    "moviepy>=2.0.0",
    "opencv-python>=4.11.0",
    "cloudpathlib>=0.20.0",
]

[project.scripts]
nexus = "scripts.cli.nexus:main"


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = [
    "core",
    "database",
    "engine",
    "utils",
    "api",
    "agents",
    "llm",
    "worker",
    "task_executor",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [".gemini", ".venv", "__pycache__", "node_modules", ".next", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "S", "B", "UP", "I", "SIM", "TID", "FAST", "ASYNC", "C4", "T20", "PT", "RET", "ARG"]
ignore = ["E501", "T201"]

[tool.pyright]
include = ["engine", "core", "utils", "api", "agents"]
exclude = [".venv", "node_modules", "frontend"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
reportAttributeAccessIssue = "warning"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["scripts", "scripts.*"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

