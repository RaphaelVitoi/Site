# ==============================================================================
# NEXUS ORCHESTRATOR — Cloud Build SOTA (Frontend)
# Pipeline: Build Docker → Push Artifact Registry → Deploy Cloud Run
# Trigger: push para branch main
# ==============================================================================

timeout: 1200s  # 20 min timeout para builds pesados

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: nexus-frontend
  _REPO: nexus-repo
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _MEMORY: 512Mi
  _CPU: "1"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest

steps:
  # 1. Build da Imagem Docker (multi-stage, standalone output)
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-progress
      - --build-arg
      - NEXT_TELEMETRY_DISABLED=1
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest
      - -f
      - frontend/Dockerfile
      - ./frontend
    env:
      - NEXT_TELEMETRY_DISABLED=1

  # 2. Push para o Artifact Registry (todas as tags)
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    waitFor: [docker-build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend
      - --all-tags

  # 3. Deploy Cloud Run — Auto-Scaling Serverless com parâmetros SOTA
  - id: cloudrun-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [docker-push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --port
      - "3000"
      - --cpu
      - ${_CPU}
      - --memory
      - ${_MEMORY}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --allow-unauthenticated
      - --set-env-vars
      - NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1
      - --cpu-throttling
      - --execution-environment
      - gen2

