# ==============================================================================
# NEXUS SOTA TOOLS REGISTRY — PROTOCOLO CHICO SOTA v8.0 GOLD
# ==============================================================================

tools:
  - name: "hybrid_router"
    version: "2.0.0"
    # Descontinuado em 2026-09-16 (registro-2026-09-16-benchmarks-medidos-e-nao-declarados):
    # sem consumidor no fluxo real e com nomenclatura de modelo propria, fora de
    # llm/model_registry.py, que e a fonte unica de roteamento (CLAUDE.md, secao 3).
    status: "descontinuado"
    substituto: "llm/routing_policy.py + llm/model_registry.py"
    description: "Gateway descontinuado; a rota vigente usa llm/routing_policy.py e llm/model_registry.py com Gemini 3.8 Flash."
    path: "tools/hybrid_router"
    entrypoint: "app:app"
    protocol: "fastapi_rest"
    ports:
      api: 8000
      local_engine: 8080
    targets:
      - "LOCAL_LLAMA_VULKAN"
      - "GEMINI_38_FLASH_STANDARD"
      - "GEMINI_38_FLASH_THINKING"
    features:
      - "static_complexity_analysis"
      - "submillisecond_triage"
      - "dynamic_thinking_budget"
      - "pydantic_v2_validation"
      - "concurrent_benchmark_suite"
      - "quad_panel_sota_visual_dashboard"
