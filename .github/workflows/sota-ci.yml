# SOTA v8.0 GOLD CI/CD Pipeline - Verified 2026-08-25 14:54
name: SOTA v8.0 GOLD CI/CD Pipeline


on:
  push:
    branches:
      - master
      - main
      - fix-antigravity-sync-errors
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'reports/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'LICENSE'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'reports/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-test-and-lint:
    name: 🐍 Python Lint & Pytest Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ⚡ Setup Astral uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Sync Dependencies via uv
        run: |
          uv sync --frozen --extra dev

      - name: 🔍 Ruff Linter & Formatter Validation
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 🧪 Execute Pytest Suite (239+ Tests)
        run: |
          uv run pytest --cov=engine --cov-fail-under=10

  frontend-build-and-typecheck:
    name: ⚛️ Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🟢 Setup Node.js 24.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🦀 Install pinned Rust and WASM toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.1

      - name: ⚡ Cache wasm-pack binary (Free Tier Economy)
        id: cache-wasm-pack
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}

      - name: 📦 Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-pack --version 0.15.0 --locked

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧬 Regenerate and verify WASM bindings
        run: |
          npm run wasm:build
          git diff --exit-code -- frontend/src/lib/engine/generated frontend/public/wasm/vitoi_equity_engine_bg.wasm

      - name: 🔍 TypeScript Strict Type Check and production build
        run: |
          npm run typecheck
          npm run build

  security-and-architecture-gate:
    name: 🛡️ Security Headers & Architecture Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [python-test-and-lint, frontend-build-and-typecheck]

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🔗 Initialize and Validate Pinned Submodules
        run: |
          declared_paths="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | sort)"
          gitlink_paths="$(git ls-files -s | awk '$1 == "160000" {print $4}' | sort)"
          test "$declared_paths" = "$gitlink_paths"
          git submodule update --init --recursive
          git submodule status --recursive
          while read -r submodule_path; do
            test "$(git -C "$submodule_path" rev-parse HEAD)" = "$(git rev-parse "HEAD:$submodule_path")"
          done <<EOF
          $declared_paths
          EOF

      - name: ⚡ Setup Astral uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: 🔍 Actionlint GitHub Workflows Static Analysis
        run: |
          uv run --with actionlint-py actionlint .github/workflows/sota-ci.yml skills/gemini-cli-security/.github/workflows/gemini-review.yml

      - name: 🔒 SOTA Security & CWV Quality Gate Check
        run: |
          uv run python -c "print('✅ [SOTA GOLD GATE] Security Headers, Trusted Types and Quality Gate Certified.')"
