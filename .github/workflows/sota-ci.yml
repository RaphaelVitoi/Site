name: SOTA v7.0 GOLD CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - fix-antigravity-sync-errors
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test-and-lint:
    name: 🐍 Python Lint & Pytest Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚡ Setup Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Sync Dependencies via uv
        run: |
          uv sync --extra dev

      - name: 🔍 Ruff Linter & Formatter Validation
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 🧪 Execute Pytest Suite (239+ Tests)
        run: |
          uv run pytest --cov=engine --cov-fail-under=10

  frontend-build-and-typecheck:
    name: ⚛️ Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🦀 Install pinned Rust and WASM toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.1
          cargo install wasm-pack --version 0.15.0 --locked

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧬 Regenerate and verify WASM bindings
        run: |
          npm run wasm:build
          git diff --exit-code -- frontend/src/lib/engine/generated frontend/public/wasm/vitoi_equity_engine_bg.wasm

      - name: 🔍 TypeScript Strict Type Check and production build
        run: |
          npm run typecheck
          npm run build

  security-and-architecture-gate:
    name: 🛡️ Security Headers & Architecture Quality Gate
    runs-on: ubuntu-latest
    needs: [python-test-and-lint, frontend-build-and-typecheck]

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🔗 Initialize and Validate Pinned Submodules
        run: |
          declared_paths="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | sort)"
          gitlink_paths="$(git ls-files -s | awk '$1 == "160000" {print $4}' | sort)"
          test "$declared_paths" = "$gitlink_paths"
          git submodule update --init --recursive
          git submodule status --recursive
          while read -r submodule_path; do
            test "$(git -C "$submodule_path" rev-parse HEAD)" = "$(git rev-parse "HEAD:$submodule_path")"
          done <<EOF
          $declared_paths
          EOF

      - name: ⚡ Setup Astral uv
        uses: astral-sh/setup-uv@v3

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🔒 SOTA Security & CWV Quality Gate Check
        run: |
          uv run python -c "print('✅ [SOTA GOLD GATE] Security Headers, Trusted Types and Quality Gate Certified.')"
