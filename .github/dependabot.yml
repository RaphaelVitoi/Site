# SOTA v8.0 GOLD: Dependabot Automated Security & Dependency Management
version: 2
updates:
  # Python dependencies (pyproject.toml / uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "chromadb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]

  # Frontend & monorepo dependencies (npm / package.json workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-npm)"
      include: "scope"
    groups:
      frontend-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Rust Cargo dependencies (nexus-core-rust)
  - package-ecosystem: "cargo"
    directory: "/core/nexus-core-rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-rust)"
      include: "scope"
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Rust WASM dependencies (wasm-equity)
  - package-ecosystem: "cargo"
    directory: "/wasm-equity"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-wasm)"
      include: "scope"
    groups:
      wasm-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "astral-sh/*"
