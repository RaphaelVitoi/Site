# SOTA v8.0 GOLD: Dependabot Automated Security & Dependency Management
version: 2
updates:
  # Python dependencies (pyproject.toml / uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "chromadb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Frontend dependencies (npm / package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-npm)"
      include: "scope"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "astral-sh/*"

