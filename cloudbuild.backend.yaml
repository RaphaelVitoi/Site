# ==============================================================================
# NEXUS ORCHESTRATOR — Cloud Build SOTA (Backend)
# Pipeline: Quality Gate → Build Docker → Push Artifact Registry → Deploy Cloud Run
# Trigger: push para branch main (filtro por paths: core/**, api/**, engine/**)
# ==============================================================================

timeout: 1800s  # 30 min — backend tem quality gate + testes

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: nexus-backend
  _REPO: nexus-repo
  _MIN_INSTANCES: "1"   # manter 1 instância quente (FastAPI tem cold start lento)
  _MAX_INSTANCES: "20"
  _MEMORY: 2Gi          # RAG + ML models requerem RAM
  _CPU: "2"
  _PORT: "8080"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest

steps:
  # 0. Quality Gate SOTA — Lint + Type Check (fail fast antes do build)
  - id: quality-gate
    name: ghcr.io/astral-sh/uv:python3.12-slim
    entrypoint: sh
    args:
      - -c
      - |
        uv sync --frozen --extra dev --no-progress
        uv run ruff check . --output-format=github
        uv run ruff format . --check
        echo "Quality Gate: PASS"
    env:
      - UV_LINK_MODE=copy

  # 1. Build da Imagem Docker Backend (UV multi-stage)
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    waitFor: [quality-gate]
    args:
      - build
      - --no-progress
      - --build-arg
      - PORT=${_PORT}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - -f
      - Dockerfile
      - .

  # 2. Push para Artifact Registry
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    waitFor: [docker-build]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend
      - --all-tags

  # 3. Deploy Cloud Run Backend — Alta disponibilidade com min-instances=1
  - id: cloudrun-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [docker-push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --port
      - ${_PORT}
      - --cpu
      - ${_CPU}
      - --memory
      - ${_MEMORY}
      - --min-instances
      - ${_MIN_INSTANCES}
      - --max-instances
      - ${_MAX_INSTANCES}
      - --timeout
      - "300"
      - --concurrency
      - "80"
      - --allow-unauthenticated
      - --set-env-vars
      - PYTHONUNBUFFERED=1,UV_COMPILE_BYTECODE=1
      - --execution-environment
      - gen2
