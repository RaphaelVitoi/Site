rules:
  - id: sota-fastapi-auth-enforcement
    languages:
      - python
    message: "[SOTA SECURITY] Rota FastAPI exposta sem blindagem. Todas as rotas devem validar autenticação injetando 'Depends()' nos argumentos ou no decorador."
    patterns:
      # Captura qualquer declaração de rota FastAPI
      - pattern: |
          @app.$METHOD(...)
          async def $FUNC(...):
            ...
      # Filtro 1: Permite se a dependência estiver no decorador
      - pattern-not: |
          @app.$METHOD(..., dependencies=[...], ...)
          async def $FUNC(...):
            ...
      # Filtro 2: Permite se houver injeção de Depends nos parâmetros
      - pattern-not: |
          @app.$METHOD(...)
          async def $FUNC(..., $VAR = Depends(...), ...):
            ...
      # Filtro 3: Ignora a rota raiz (Health Check público)
      - pattern-not: |
          @app.get("/")
          async def root_health_check(...):
            ...
    severity: ERROR

  - id: sota-nextjs-auth-enforcement
    languages:
      - typescript
    message: "[SOTA SECURITY] Endpoint Next.js API exposto sem blindagem 'auth()'. Todos os routes devem validar a sessao."
    patterns:
      - pattern: |
          export async function $METHOD(...) {
            ...
          }
      - pattern-not: |
          export async function $METHOD(...) {
            ...
            const $SESSION = await auth();
            if (!$SESSION) { ... }
            ...
          }
    severity: ERROR

  - id: sota-secrets-hardcoded
    languages:
      - python
      - typescript
      - javascript
    message: '[SOTA SECURITY] Exposição detectada de segredo hardcoded (p/secrets).'
    patterns:
      - pattern-regex: "(?i)(api_key|password|secret|token)\\s*=\\s*['\"][a-zA-Z0-9]{15,}['\"]"
    severity: ERROR

  - id: sota-nextjs-dangerous-html
    languages:
      - typescript
      - javascript
    message: '[SOTA SECURITY] Uso de dangerouslySetInnerHTML pode causar XSS (p/nextjs, p/typescript).'
    pattern: dangerouslySetInnerHTML={...}
    severity: WARNING

  - id: sota-no-import-outside-toplevel
    languages:
      - python
    message: "[SOTA ARCHITECTURE] Import fora do nível superior detectado. Mova imports para o topo do módulo com fallback defensivo em try/except se for dependência opcional."
    patterns:
      - pattern-either:
          - pattern: |
              def $FUNC(...):
                ...
                import $PKG
          - pattern: |
              def $FUNC(...):
                ...
                from $PKG import $NAME
      - pattern-not-inside: |
          if TYPE_CHECKING:
            ...
    severity: WARNING
